<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bileşen önizleme</title>
<link rel="stylesheet" href="segmented-control.css"><link rel="stylesheet" href="copy-button.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f4f2;color:#0b1210;font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
:root.dark body{background:#141617;color:#edf0f2}
main{width:min(560px,100% - 32px);display:flex;flex-direction:column;gap:28px}
.row{display:flex;flex-direction:column;gap:8px}
label{font-weight:600;font-size:13px}
pre{margin:0;padding:16px;border-radius:16px;background:#111a17;color:#e4ecE8;font:12.5px/1.7 ui-monospace,monospace;white-space:pre-wrap}
small{color:#5a635f}
</style>
</head>
<body>
<main>
  <div class="row"><label for="qualitySelect">Detay seviyesi</label>
    <select id="qualitySelect"><option value="simple">Kısa</option><option value="detailed">Detaylı</option><option value="professional" selected>Profesyonel</option></select></div>
  <div class="row"><label for="languageSelect">Şablon dili</label>
    <select id="languageSelect"><option value="tr" selected>Türkçe</option><option value="en">English</option></select>
    <small>Ok tuşları, Home ve End ile gezilebilir. Seçim gizli &lt;select&gt;'e yazılır: <b id="val"></b></small></div>
  <pre id="out">Şu fikir için bir görsel oluştur: Bir kahve markası için sade, sembolik bir logo.</pre>
  <div style="display:flex;gap:8px"><button id="copy"></button><button id="copyIcon"></button><button id="theme" style="margin-left:auto">Tema değiştir</button></div>
</main>
<script src="segmented-control.js"></script><script src="copy-button.js"></script>
<script>
const q=document.getElementById("qualitySelect"),l=document.getElementById("languageSelect");
SegmentedControl.fromSelect(q,{label:"Detay seviyesi"});SegmentedControl.fromSelect(l,{label:"Şablon dili"});
const show=()=>document.getElementById("val").textContent=q.value+" · "+l.value;[q,l].forEach(s=>s.addEventListener("change",show));show();
CopyButton.attach(document.getElementById("copy"),()=>document.getElementById("out").textContent,{label:"Promptu kopyala"});
CopyButton.attach(document.getElementById("copyIcon"),()=>document.getElementById("out").textContent,{label:"Kopyala",iconOnly:true});
document.getElementById("theme").onclick=()=>document.documentElement.classList.toggle("dark");
</script>
</body>
</html>
